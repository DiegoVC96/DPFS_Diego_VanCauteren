<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | NeoHorizon Tech</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="/public/css/register.css">
</head>
<body class="auth-page">

    <div class="auth-container animate-fade">
        <header class="auth-header">
            <a href="index.html" class="logo font-tech neon-text">NEOHORIZON</a>
            <h1 class="font-tech">ÚNETE A LA ÉLITE</h1>
            <p>Crea tu cuenta para gestionar tus pedidos y configuraciones.</p>
        </header>

        <form class="auth-form">
            <div class="form-group">
                <label for="name" class="font-tech">NOMBRE COMPLETO</label>
                <input type="text" id="name" placeholder="Ej: Armando Casas" required>
            </div>

            <div class="form-group">
                <label for="email" class="font-tech">EMAIL</label>
                <input type="email" id="email" placeholder="armcas@email.com" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password" class="font-tech">CONTRASEÑA</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="font-tech">CONFIRMAR</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" required>
                    <span class="checkmark"></span>
                    Acepto los <a href="#">Términos y Condiciones</a>
                </label>
            </div>

            <button type="submit" class="btn-primary btn-full btn-glow font-tech">CREAR CUENTA</button>
            
            <p class="auth-footer">
                ¿Ya tienes una cuenta? <a href="login.html" class="neon-text">Inicia sesión aquí</a>
            </p>
        </form>
    </div>

</body>
</html>
